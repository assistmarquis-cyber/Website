[build]
  command = "npm run build"
  publish = "dist"

# Primary domain: bigpicturearchitect.com. Other domains redirect to it.
[[redirects]]
  from = "https://bigpicturearkitect.com/*"
  to = "https://bigpicturearchitect.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bigpicturearkitect.com/*"
  to = "https://bigpicturearchitect.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://marquisharmon.com/*"
  to = "https://bigpicturearchitect.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.marquisharmon.com/*"
  to = "https://bigpicturearchitect.com/:splat"
  status = 301
  force = true


# Security headers. The first block is safe for every page. The second tightens the
# pages that handle personal reflections (Alan and The Room) and the function behind them.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"

[[headers]]
  for = "/alan/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/partner/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/ops/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.netlify/functions/alan"
  [headers.values]
    Cache-Control = "no-store"
